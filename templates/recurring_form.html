{% extends "base.html" %}
{% block title %}Edit recurring payment{% endblock %}
{% block content %}
<div class="page-container"><section class="section-heading"><div><p class="eyebrow">Manage schedule</p><h1>Edit recurring payment</h1></div></section>
<form class="panel compact-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>Name <input name="title" value="{{ payment.title }}" required></label><label>Amount <input name="amount" type="number" min="0.01" step="0.01" value="{{ payment.amount }}" required></label><label>Frequency <select name="frequency">{% for frequency in ['weekly','monthly','quarterly','yearly'] %}<option {% if payment.frequency == frequency %}selected{% endif %}>{{ frequency }}</option>{% endfor %}</select></label><label>Next due date <input name="next_due_date" type="date" value="{{ payment.next_due_date }}" required></label><label>Category <input name="category" value="{{ payment.category }}"></label><label>Vendor <input name="vendor" value="{{ payment.vendor }}"></label><label>Payment method <input name="payment_method" value="{{ payment.payment_method }}"></label><label>Notes <textarea name="notes">{{ payment.notes }}</textarea></label><button class="primary-button" type="submit">Update payment</button></form></div>
{% endblock %}
